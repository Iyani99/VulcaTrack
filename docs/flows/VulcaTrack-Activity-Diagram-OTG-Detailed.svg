<rect x="25" y="187.2" width="300" height="67.6" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="175" y="216" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="175" dy="0">Log in &amp; open</tspan><tspan x="175" dy="24.8">Book a Rescue</tspan></text>
<rect x="25" y="281.2" width="300" height="67.6" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="175" y="310" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="175" dy="0">Choose an active saved</tspan><tspan x="175" dy="24.8">vehicle; describe problem</tspan></text>
<rect x="25" y="375.2" width="300" height="67.6" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="175" y="404" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="175" dy="0">Share location: browser,</tspan><tspan x="175" dy="24.8">search or optional map pin</tspan></text>
<rect x="25" y="469.2" width="300" height="67.6" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="175" y="498" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="175" dy="0">Confirm contact number</tspan><tspan x="175" dy="24.8">on file; submit request</tspan></text>
<rect x="380" y="469.2" width="320" height="67.6" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="540" y="498" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="540" dy="0">Validate customer, vehicle</tspan><tspan x="540" dy="24.8">ownership &amp; request data</tspan></text>
<rect x="380" y="563.2" width="320" height="67.6" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="540" y="592" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="540" dy="0">Compute the ETA once</tspan><tspan x="540" dy="24.8">(customer point + shop)</tspan></text>
<rect x="380" y="657.2" width="320" height="67.6" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="540" y="686" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="540" dy="0">Save request: pending;</tspan><tspan x="540" dy="24.8">ETA frozen (never updated)</tspan></text>
<rect x="25" y="657.2" width="300" height="67.6" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="175" y="686" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="175" dy="0">See confirmation, frozen</tspan><tspan x="175" dy="24.8">ETA and status Pending</tspan></text>
<rect x="765" y="657.2" width="300" height="67.6" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="915" y="686" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="915" dy="0">Review pending request</tspan><tspan x="915" dy="24.8">(details, location, ETA)</tspan></text>
<path d="M915,747 L995,785 L915,823 L835,785 z" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="915" y="792.4" font-size="21" font-weight="600" fill="#111" text-anchor="middle"><tspan x="915" dy="0">Admin action?</tspan></text>
<rect x="765" y="845.2" width="300" height="67.6" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="915" y="874" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="915" dy="0">Accept &amp; assign an active</tspan><tspan x="915" dy="24.8">Tireman (one action)</tspan></text>
<rect x="380" y="845.2" width="320" height="67.6" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="540" y="874" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="540" dy="0">Save Tireman + status</tspan><tspan x="540" dy="24.8">accepted (guarded update)</tspan></text>
<rect x="25" y="926.8" width="300" height="92.3" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="175" y="955.6" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="175" dy="0">“Tireman is on the way”:</tspan><tspan x="175" dy="24.8">name, contact number,</tspan><tspan x="175" dy="24.8">frozen ETA</tspan></text>
<rect x="378" y="926.8" width="324" height="107" rx="0" fill="#fff8d6" stroke="#a08a2a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="392" y="954.8" font-size="17" font-weight="400" fill="#3d3510" text-anchor="start"><tspan x="392" dy="0">Off-system: the Tireman does</tspan></text>
<text x="392" y="976.1" font-size="17" font-weight="400" fill="#3d3510" text-anchor="start"><tspan x="392" dy="0">the roadside job; customer and</tspan></text>
<text x="392" y="997.3" font-size="17" font-weight="400" fill="#3d3510" text-anchor="start"><tspan x="392" dy="0">Tireman talk by phone. No live</tspan></text>
<text x="392" y="1018.6" font-size="17" font-weight="400" fill="#3d3510" text-anchor="start"><tspan x="392" dy="0">GPS tracking, no in-app chat.</tspan></text>
<path d="M915,1029 L995,1067 L915,1105 L835,1067 z" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="915" y="1074.4" font-size="21" font-weight="600" fill="#111" text-anchor="middle"><tspan x="915" dy="0">Next action?</tspan></text>
<rect x="765" y="1139.6" width="300" height="42.8" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="915" y="1168.4" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="915" dy="0">Mark request completed</tspan></text>
<rect x="380" y="1139.6" width="320" height="42.8" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="540" y="1168.4" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="540" dy="0">Set status = completed</tspan></text>
<rect x="25" y="1221.2" width="300" height="67.6" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="175" y="1250" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="175" dy="0">View completed request</tspan><tspan x="175" dy="24.8">(“Serviced by …”)</tspan></text>
<rect x="25" y="1315.2" width="300" height="67.6" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="175" y="1344" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="175" dy="0">Optional: rate this service</tspan><tspan x="175" dy="24.8">(1–5 stars + comment)</tspan></text>
<rect x="380" y="1315.2" width="280" height="67.6" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="520" y="1344" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="520" dy="0">Save one-time feedback</tspan><tspan x="520" dy="24.8">(status stays completed)</tspan></text>
<rect x="765" y="1198.4" width="300" height="192" rx="0" fill="#fff8d6" stroke="#a08a2a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="779" y="1226.4" font-size="17" font-weight="700" fill="#3d3510" text-anchor="start"><tspan x="779" dy="0">Status rules</tspan></text>
<text x="779" y="1247.6" font-size="17" font-weight="400" fill="#3d3510" text-anchor="start"><tspan x="779" dy="0">pending → accepted or rejected</tspan></text>
<text x="779" y="1268.9" font-size="17" font-weight="400" fill="#3d3510" text-anchor="start"><tspan x="779" dy="0">accepted → completed or rejected</tspan></text>
<text x="779" y="1290.1" font-size="17" font-weight="400" fill="#3d3510" text-anchor="start"><tspan x="779" dy="0">While accepted, the admin may</tspan></text>
<text x="779" y="1311.4" font-size="17" font-weight="400" fill="#3d3510" text-anchor="start"><tspan x="779" dy="0">reassign another active Tireman.</tspan></text>
<text x="779" y="1332.6" font-size="17" font-weight="400" fill="#3d3510" text-anchor="start"><tspan x="779" dy="0">* Reject only if no Sale linked.</tspan></text>
<text x="779" y="1353.9" font-size="17" font-weight="400" fill="#3d3510" text-anchor="start"><tspan x="779" dy="0">The POS sale is a separate action</tspan></text>
<text x="779" y="1375.1" font-size="17" font-weight="400" fill="#3d3510" text-anchor="start"><tspan x="779" dy="0">and never changes the status.</tspan></text>
<rect x="765" y="1421.6" width="300" height="42.8" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="915" y="1450.4" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="915" dy="0">Reject request</tspan></text>
<rect x="380" y="1421.6" width="320" height="42.8" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="540" y="1450.4" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="540" dy="0">Set status = rejected</tspan></text>
<rect x="25" y="1421.6" width="300" height="42.8" rx="14" fill="#dcebf6" stroke="#2f5f82" stroke-width="2"/>
<text x="175" y="1450.4" font-size="21" font-weight="400" fill="#111" text-anchor="middle"><tspan x="175" dy="0">View rejected request</tspan></text>
