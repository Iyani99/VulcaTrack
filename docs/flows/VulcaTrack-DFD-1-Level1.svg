<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="792" viewBox="0 0 1780 792" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
  </defs>

  <rect width="1780" height="792" fill="#ffffff"/>

  <!-- Title -->
  <text x="890" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">VulcaTrack: Sales and Inventory with On-the-Go Services  &#8212;  Data Flow Diagram (Level 1)</text>

  <!-- ===================== EXTERNAL ENTITIES ===================== -->
  <g>
    <rect x="50" y="88" width="200" height="76" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
    <text x="150" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#263238">Customer</text>
    <text x="150" y="144" text-anchor="middle" font-size="10.5" fill="#607d8b">registered account holder</text>
  </g>
  <g>
    <rect x="520" y="88" width="250" height="76" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
    <text x="645" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Map / Routing Service</text>
    <text x="645" y="138" text-anchor="middle" font-size="10.5" fill="#607d8b">external</text>
  </g>
  <g>
    <rect x="1395" y="88" width="200" height="76" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
    <text x="1495" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#263238">Admin</text>
    <text x="1495" y="144" text-anchor="middle" font-size="10.5" fill="#607d8b">shop staff / system manager</text>
  </g>

  <!-- ===================== PROCESSES ===================== -->
  <g>
    <rect x="55" y="282" width="220" height="118" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <circle cx="81" cy="308" r="14" fill="#1565c0"/><text x="81" y="313" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <text x="165" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">Authenticate &amp;</text>
    <text x="165" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">Manage Accounts</text>
  </g>
  <g>
    <rect x="315" y="282" width="190" height="118" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <circle cx="341" cy="308" r="14" fill="#1565c0"/><text x="341" y="313" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
    <text x="410" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">Manage Vehicles</text>
  </g>
  <g>
    <rect x="545" y="282" width="220" height="118" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <circle cx="571" cy="308" r="14" fill="#1565c0"/><text x="571" y="313" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="655" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">Submit &amp; Track</text>
    <text x="655" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">OTG Request</text>
  </g>
  <g>
    <rect x="835" y="282" width="230" height="118" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <circle cx="861" cy="308" r="14" fill="#1565c0"/><text x="861" y="313" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
    <text x="950" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">Handle OTG Request</text>
    <text x="950" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">&amp; Assign Tireman</text>
  </g>
  <g>
    <rect x="1120" y="282" width="195" height="118" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <circle cx="1146" cy="308" r="14" fill="#1565c0"/><text x="1146" y="313" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
    <text x="1217" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">Process POS Sale</text>
  </g>
  <g>
    <rect x="1355" y="282" width="180" height="118" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <circle cx="1381" cy="308" r="14" fill="#1565c0"/><text x="1381" y="313" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text>
    <text x="1445" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">Manage Inventory</text>
  </g>
  <g>
    <rect x="1575" y="282" width="170" height="118" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <circle cx="1601" cy="308" r="14" fill="#1565c0"/><text x="1601" y="313" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">7</text>
    <text x="1660" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">Generate</text>
    <text x="1660" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">Reports</text>
  </g>

  <!-- ===================== DATA STORES ===================== -->
  <g font-size="12.5">
    <rect x="50" y="476" width="190" height="50" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/><line x1="88" y1="476" x2="88" y2="526" stroke="#f9a825" stroke-width="2"/>
    <text x="69" y="506" text-anchor="middle" font-weight="700" fill="#f57f17">D1</text><text x="166" y="506" text-anchor="middle" fill="#5d4037">customers</text>

    <rect x="275" y="476" width="150" height="50" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/><line x1="313" y1="476" x2="313" y2="526" stroke="#f9a825" stroke-width="2"/>
    <text x="294" y="506" text-anchor="middle" font-weight="700" fill="#f57f17">D2</text><text x="371" y="506" text-anchor="middle" fill="#5d4037">admins</text>

    <rect x="450" y="476" width="160" height="50" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/><line x1="488" y1="476" x2="488" y2="526" stroke="#f9a825" stroke-width="2"/>
    <text x="469" y="506" text-anchor="middle" font-weight="700" fill="#f57f17">D3</text><text x="549" y="506" text-anchor="middle" fill="#5d4037">vehicles</text>

    <rect x="645" y="476" width="220" height="50" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/><line x1="683" y1="476" x2="683" y2="526" stroke="#f9a825" stroke-width="2"/>
    <text x="664" y="506" text-anchor="middle" font-weight="700" fill="#f57f17">D7</text><text x="774" y="506" text-anchor="middle" fill="#5d4037">service_requests</text>

    <rect x="900" y="476" width="170" height="50" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/><line x1="938" y1="476" x2="938" y2="526" stroke="#f9a825" stroke-width="2"/>
    <text x="919" y="506" text-anchor="middle" font-weight="700" fill="#f57f17">D8</text><text x="1004" y="506" text-anchor="middle" fill="#5d4037">tiremen</text>

    <rect x="1120" y="476" width="170" height="50" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/><line x1="1158" y1="476" x2="1158" y2="526" stroke="#f9a825" stroke-width="2"/>
    <text x="1139" y="506" text-anchor="middle" font-weight="700" fill="#f57f17">D4</text><text x="1224" y="506" text-anchor="middle" fill="#5d4037">items</text>

    <rect x="1320" y="476" width="160" height="50" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/><line x1="1358" y1="476" x2="1358" y2="526" stroke="#f9a825" stroke-width="2"/>
    <text x="1339" y="506" text-anchor="middle" font-weight="700" fill="#f57f17">D5</text><text x="1419" y="506" text-anchor="middle" fill="#5d4037">sales</text>

    <rect x="1510" y="476" width="180" height="50" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/><line x1="1548" y1="476" x2="1548" y2="526" stroke="#f9a825" stroke-width="2"/>
    <text x="1529" y="506" text-anchor="middle" font-weight="700" fill="#f57f17">D6</text><text x="1619" y="506" text-anchor="middle" fill="#5d4037">sale_items</text>
  </g>

  <!-- ===================== FLOWS ===================== -->
  <g stroke="#455a64" stroke-width="1.5" fill="none">
    <!-- entity <-> process -->
    <line x1="145" y1="164" x2="150" y2="282" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="205" y1="164" x2="378" y2="282" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="240" y1="164" x2="600" y2="282" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="650" y1="164" x2="690" y2="282" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <polyline points="1405,88 1405,58 28,58 28,300 55,300" marker-end="url(#ar)"/>
    <line x1="1418" y1="150" x2="1058" y2="282" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="1462" y1="164" x2="1250" y2="282" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="1500" y1="164" x2="1458" y2="282" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="1538" y1="158" x2="1648" y2="282" marker-start="url(#ar)" marker-end="url(#ar)"/>

    <!-- process <-> store -->
    <line x1="150" y1="400" x2="150" y2="476" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="240" y1="400" x2="342" y2="476" marker-end="url(#ar)"/>
    <line x1="425" y1="400" x2="510" y2="476" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="600" y1="400" x2="572" y2="476" marker-end="url(#ar)"/>
    <line x1="655" y1="400" x2="705" y2="476" marker-end="url(#ar)"/>
    <line x1="740" y1="400" x2="912" y2="474" marker-end="url(#ar)"/>
    <line x1="895" y1="400" x2="800" y2="476" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="985" y1="400" x2="985" y2="476" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <polyline points="870,400 870,548 150,548 150,528" marker-end="url(#ar)"/>
    <line x1="1210" y1="400" x2="1388" y2="476" marker-end="url(#ar)"/>
    <line x1="1255" y1="400" x2="1575" y2="474" marker-end="url(#ar)"/>
    <line x1="1160" y1="400" x2="1188" y2="476" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="1420" y1="400" x2="1250" y2="476" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="1640" y1="400" x2="1452" y2="476" marker-end="url(#ar)"/>
    <line x1="1668" y1="400" x2="1628" y2="476" marker-end="url(#ar)"/>
  </g>

  <!-- ===================== FLOW LABELS ===================== -->
  <g font-size="11" fill="#37474f">
    <g text-anchor="start"><rect x="156" y="204" width="80" height="30" fill="#fff"/><text x="160" y="216">credentials,</text><text x="160" y="230">profile</text></g>
    <g text-anchor="middle"><rect x="238" y="200" width="70" height="16" fill="#fff"/><text x="273" y="212">vehicle data</text></g>
    <g text-anchor="middle"><rect x="352" y="186" width="128" height="30" fill="#fff"/><text x="416" y="198">OTG request /</text><text x="416" y="212">status, ETA</text></g>
    <g text-anchor="start"><rect x="704" y="204" width="96" height="30" fill="#fff"/><text x="708" y="216">coordinates /</text><text x="708" y="230">route + ETA</text></g>
    <g text-anchor="middle"><rect x="214" y="40" width="150" height="16" fill="#fff"/><text x="289" y="52">admin login / session</text></g>
    <g text-anchor="middle"><rect x="1150" y="202" width="118" height="30" fill="#fff"/><text x="1209" y="214">OTG queue /</text><text x="1209" y="228">decisions, assign</text></g>
    <g text-anchor="middle"><rect x="1300" y="206" width="94" height="30" fill="#fff"/><text x="1347" y="218">sale entry /</text><text x="1347" y="232">receipt</text></g>
    <g text-anchor="start"><rect x="1470" y="206" width="86" height="30" fill="#fff"/><text x="1474" y="218">item &amp; stock</text><text x="1474" y="232">edits, lists</text></g>
    <g text-anchor="middle"><rect x="1588" y="204" width="110" height="30" fill="#fff"/><text x="1643" y="216">report request /</text><text x="1643" y="230">sales reports</text></g>

    <g text-anchor="end"><rect x="86" y="424" width="60" height="16" fill="#fff"/><text x="142" y="436">account</text></g>
    <g text-anchor="middle"><rect x="266" y="424" width="44" height="16" fill="#fff"/><text x="288" y="436">verify</text></g>
    <g text-anchor="middle"><rect x="416" y="424" width="96" height="16" fill="#fff"/><text x="464" y="436">vehicle records</text></g>
    <g text-anchor="middle"><rect x="622" y="424" width="76" height="16" fill="#fff"/><text x="660" y="436">new request</text></g>
    <g text-anchor="middle"><rect x="778" y="422" width="118" height="16" fill="#fff"/><text x="837" y="434">status; tireman_id</text></g>
    <g text-anchor="end"><rect x="902" y="452" width="120" height="16" fill="#fff"/><text x="1018" y="464">Tireman name / contact (read)</text></g>
    <g text-anchor="middle"><rect x="928" y="420" width="128" height="16" fill="#fff"/><text x="992" y="432">Tireman records</text></g>
    <g text-anchor="middle"><rect x="330" y="540" width="300" height="16" fill="#fff"/><text x="480" y="552">P4 &#8594; D1 : customer name + contact (read)</text></g>
    <g text-anchor="end"><rect x="1084" y="420" width="76" height="16" fill="#fff"/><text x="1158" y="432">price; stock &#8722;</text></g>
    <g text-anchor="middle"><rect x="1398" y="420" width="92" height="16" fill="#fff"/><text x="1444" y="432">item &amp; stock</text></g>
    <g text-anchor="middle"><rect x="1592" y="420" width="120" height="16" fill="#fff"/><text x="1652" y="432">sales, sale_items (read)</text></g>
  </g>

  <!-- ===================== LEGEND / NOTES ===================== -->
  <g>
    <rect x="45" y="576" width="1690" height="200" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>

    <text x="66" y="602" font-size="13" font-weight="700" fill="#37474f">Notation</text>
    <rect x="66" y="614" width="30" height="16" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="106" y="626" font-size="11.5" fill="#37474f">process (numbered)</text>
    <rect x="66" y="638" width="30" height="16" fill="#eceff1" stroke="#37474f" stroke-width="1.5"/><text x="106" y="650" font-size="11.5" fill="#37474f">external entity</text>
    <rect x="66" y="662" width="30" height="16" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><line x1="74" y1="662" x2="74" y2="678" stroke="#f9a825" stroke-width="1.5"/><text x="106" y="674" font-size="11.5" fill="#37474f">data store (= database table)</text>
    <line x1="66" y1="696" x2="96" y2="696" stroke="#455a64" stroke-width="1.5" marker-end="url(#ar)"/><text x="106" y="700" font-size="11.5" fill="#37474f">data flow</text>
    <line x1="66" y1="718" x2="96" y2="718" stroke="#455a64" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="106" y="722" font-size="11.5" fill="#37474f">request / response dialogue</text>

    <text x="470" y="602" font-size="13" font-weight="700" fill="#37474f">Data stores (one per MySQL table &#8212; see docs/ERD/schema.dbml)</text>
    <text x="470" y="624" font-size="11.5" fill="#5d4037">D1 customers &#160;&#183;&#160; D2 admins &#160;&#183;&#160; D3 vehicles &#160;&#183;&#160; D4 items</text>
    <text x="470" y="644" font-size="11.5" fill="#5d4037">D5 sales &#160;&#183;&#160; D6 sale_items &#160;&#183;&#160; D7 service_requests &#160;&#183;&#160; D8 tiremen</text>
    <text x="470" y="674" font-size="13" font-weight="700" fill="#37474f">Actors</text>
    <text x="470" y="694" font-size="11.5" fill="#607d8b">Customer &#8212; requests OTG service.  Admin &#8212; manages the system and</text>
    <text x="470" y="710" font-size="11.5" fill="#607d8b">handles requests.  Tireman &#8212; performs the service; a record in D8, not a</text>
    <text x="470" y="726" font-size="11.5" fill="#607d8b">system user &#8212; the Admin assigns one and the customer calls by phone.</text>

    <text x="1010" y="602" font-size="13" font-weight="700" fill="#37474f">Scope notes</text>
    <text x="1010" y="624" font-size="11.5" fill="#607d8b">&#8226; No live technician tracking. Route and ETA are computed once by the</text>
    <text x="1024" y="640" font-size="11.5" fill="#607d8b">Map / Routing Service at request time; the ETA is a frozen snapshot in</text>
    <text x="1024" y="656" font-size="11.5" fill="#607d8b">service_requests.eta_minutes. The shop location is an app-config value.</text>
    <text x="1010" y="678" font-size="11.5" fill="#607d8b">&#8226; Online / gateway payment (e.g. GCash) is out of scope. In-person cash</text>
    <text x="1024" y="694" font-size="11.5" fill="#607d8b">tender &amp; change are computed in the POS UI only; sales.total_amount is</text>
    <text x="1024" y="710" font-size="11.5" fill="#607d8b">the only money value stored. Walk-in sales need no customer account.</text>
    <text x="1010" y="732" font-size="11.5" fill="#607d8b">&#8226; Product sale lines decrement D4 items stock; service lines do not.</text>
    <text x="1010" y="748" font-size="11.5" fill="#607d8b">&#8226; Deactivation (is_active = 0) replaces hard-delete for D4, D3 and D8.</text>
    <text x="1010" y="764" font-size="11.5" fill="#607d8b">&#8226; Reports (process 7) are built from D5 sales and D6 sale_items.</text>
  </g>
</svg>
