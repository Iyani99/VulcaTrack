<text x="490" y="210" font-size="20" font-weight="400" fill="#111" text-anchor="middle"><tspan x="490" dy="0">Registration and Log In details</tspan><tspan x="490" dy="29">Profile and Vehicle information</tspan><tspan x="490" dy="29">Rescue request and location</tspan><tspan x="490" dy="29">Completed Rescue feedback</tspan></text>
<text x="490" y="565" font-size="20" font-weight="400" fill="#111" text-anchor="middle"><tspan x="490" dy="0">Account and Vehicle views</tspan><tspan x="490" dy="29">Booking confirmation and frozen ETA</tspan><tspan x="490" dy="29">Rescue status, bookings and assigned Tireman</tspan></text>
