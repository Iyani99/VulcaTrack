<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="764" viewBox="0 0 1520 764" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33383d"/></marker></defs>
<rect width="1520" height="764" fill="#fff"/>
<text x="760" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">VulcaTrack: Sales and Inventory with On-the-Go Services</text>
<text x="760" y="60" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6b7b">Context Diagram  (Data Flow Diagram &#8211; Level 0)</text>

<circle cx="760" cy="320" r="150" fill="#fff" stroke="#123a6b" stroke-width="2.4"/>
<text x="760" y="313" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1a1a1a">VulcaTrack</text>
<text x="760" y="337" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1a1a1a">System</text>
<circle cx="760" cy="192" r="12.5" fill="#123a6b"/>
<text x="760" y="196.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">0</text>

<rect x="70" y="245" width="210" height="150" fill="#eef0f3" stroke="#1a1a1a" stroke-width="2"/>
<text x="175" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Customer</text>
<rect x="1240" y="245" width="210" height="150" fill="#eef0f3" stroke="#1a1a1a" stroke-width="2"/>
<text x="1345" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Admin</text>

<!-- Customer -> System -->
<line x1="280" y1="278" x2="612" y2="278" stroke="#33383d" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="360" y="166" width="272" height="70" fill="#fff" fill-opacity="0.92"/>
<text x="496" y="180" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Login Credentials / Registration Details</text>
<text x="496" y="195" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Profile Information</text>
<text x="496" y="210" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Vehicle Information</text>
<text x="496" y="225" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Service Request &amp; Location Coordinates</text>
<!-- System -> Customer -->
<line x1="613" y1="366" x2="280" y2="366" stroke="#33383d" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="352" y="380" width="288" height="86" fill="#fff" fill-opacity="0.92"/>
<text x="496" y="394" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Account Confirmation</text>
<text x="496" y="409" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Saved Vehicle List</text>
<text x="496" y="424" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Request Confirmation, Frozen ETA &amp; Status</text>
<text x="496" y="439" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Assigned Tireman Name &amp; Contact</text>
<text x="496" y="454" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Service Request History</text>

<!-- Admin -> System -->
<line x1="1240" y1="278" x2="908" y2="278" stroke="#33383d" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="846" y="150" width="322" height="102" fill="#fff" fill-opacity="0.92"/>
<text x="1007" y="164" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Login Credentials</text>
<text x="1007" y="179" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Product / Service Information</text>
<text x="1007" y="194" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Stock Updates &amp; Item Activation</text>
<text x="1007" y="209" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Sale Details  (items, quantities, cash tendered)</text>
<text x="1007" y="224" text-anchor="middle" font-size="11.5" fill="#1a1a1a">OTG Request Decision &amp; Tireman Assignment</text>
<text x="1007" y="239" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Tireman Information</text>
<!-- System -> Admin -->
<line x1="907" y1="366" x2="1240" y2="366" stroke="#33383d" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="872" y="380" width="270" height="70" fill="#fff" fill-opacity="0.92"/>
<text x="1007" y="394" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Access Confirmation</text>
<text x="1007" y="409" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Inventory List &amp; Low-Stock Alerts</text>
<text x="1007" y="424" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Pending OTG Requests, Location &amp; Details</text>
<text x="1007" y="439" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Printable Receipt</text>

<text x="760" y="520" text-anchor="middle" font-size="12" fill="#5b6b7b" font-style="italic">The Tireman performs the on-the-go service but is not a system user: the Admin records and assigns Tiremen, and the customer</text>
<text x="760" y="538" text-anchor="middle" font-size="12" fill="#5b6b7b" font-style="italic">contacts the assigned Tireman by phone.  No live GPS tracking &#8212; location and ETA are captured once at request time and stored</text>
<text x="760" y="556" text-anchor="middle" font-size="12" fill="#5b6b7b" font-style="italic">as a frozen snapshot.  Online / gateway payment (e.g. GCash) is out of scope.</text>

<rect x="70" y="606" width="380" height="118" fill="#fafafa" stroke="#dcdfe3"/>
<text x="86" y="632" text-anchor="start" font-size="12.5" font-weight="700" fill="#1a1a1a">Notation</text>
<circle cx="98" cy="654" r="10" fill="#fff" stroke="#123a6b" stroke-width="1.8"/>
<text x="118" y="658" text-anchor="start" font-size="11.5" fill="#1a1a1a">Process</text>
<rect x="88" y="670" width="22" height="16" fill="#eef0f3" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="118" y="683" text-anchor="start" font-size="11.5" fill="#1a1a1a">External Entity</text>
<path d="M300,646 h-24 v16 h24" fill="none" stroke="#123a6b" stroke-width="1.8"/>
<text x="310" y="658" text-anchor="start" font-size="11.5" fill="#1a1a1a">Data Store</text>
<line x1="276" y1="678" x2="302" y2="678" stroke="#33383d" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="310" y="682" text-anchor="start" font-size="11.5" fill="#1a1a1a">Data Flow</text>
<text x="86" y="712" text-anchor="start" font-size="10.5" fill="#5b6b7b">Level 1 decomposes process 0 into six processes and seven data stores &#8211; see VulcaTrack-DFD-1-Level1.</text>
</svg>
