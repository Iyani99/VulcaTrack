<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
  </defs>

  <rect width="1500" height="650" fill="#ffffff"/>

  <!-- Title -->
  <text x="750" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="#1a1a1a">VulcaTrack: Sales and Inventory with On-the-Go Services</text>
  <text x="750" y="60" text-anchor="middle" font-size="15" fill="#546e7a">Context Diagram &#8212; Data Flow Diagram (Level 0)</text>

  <!-- Central process -->
  <rect x="585" y="170" width="330" height="176" rx="24" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <circle cx="619" cy="204" r="16" fill="#1565c0"/>
  <text x="619" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">0</text>
  <text x="750" y="264" text-anchor="middle" font-size="20" font-weight="700" fill="#0d47a1">VulcaTrack</text>
  <text x="750" y="292" text-anchor="middle" font-size="20" font-weight="700" fill="#0d47a1">System</text>

  <!-- Customer entity -->
  <rect x="55" y="198" width="198" height="100" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
  <text x="154" y="238" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">Customer</text>
  <text x="154" y="262" text-anchor="middle" font-size="11.5" fill="#546e7a">registered account</text>
  <text x="154" y="278" text-anchor="middle" font-size="11.5" fill="#546e7a">holder</text>

  <!-- Admin entity -->
  <rect x="1247" y="198" width="198" height="100" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
  <text x="1346" y="238" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">Admin</text>
  <text x="1346" y="262" text-anchor="middle" font-size="11.5" fill="#546e7a">shop staff /</text>
  <text x="1346" y="278" text-anchor="middle" font-size="11.5" fill="#546e7a">system manager</text>

  <!-- Map / Routing entity -->
  <rect x="638" y="470" width="224" height="100" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
  <text x="750" y="508" text-anchor="middle" font-size="16" font-weight="700" fill="#263238">Map / Routing</text>
  <text x="750" y="529" text-anchor="middle" font-size="16" font-weight="700" fill="#263238">Service</text>
  <text x="750" y="551" text-anchor="middle" font-size="11.5" fill="#546e7a">external</text>

  <!-- Flow: Customer -> System -->
  <line x1="253" y1="222" x2="581" y2="222" stroke="#455a64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="417" y="173" text-anchor="middle" font-size="12.5" fill="#37474f">registration, login, profile edits</text>
  <text x="417" y="190" text-anchor="middle" font-size="12.5" fill="#37474f">vehicle details</text>
  <text x="417" y="207" text-anchor="middle" font-size="12.5" fill="#37474f">OTG service request (problem + shared location)</text>

  <!-- Flow: System -> Customer -->
  <line x1="581" y1="300" x2="253" y2="300" stroke="#455a64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="417" y="324" text-anchor="middle" font-size="12.5" fill="#37474f">account status, dashboard data</text>
  <text x="417" y="341" text-anchor="middle" font-size="12.5" fill="#37474f">request status, ETA, assigned Tireman</text>
  <text x="417" y="358" text-anchor="middle" font-size="12.5" fill="#37474f">request history, receipt (if linked)</text>

  <!-- Flow: Admin -> System -->
  <line x1="1247" y1="222" x2="919" y2="222" stroke="#455a64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1083" y="173" text-anchor="middle" font-size="12.5" fill="#37474f">login, inventory &amp; stock updates</text>
  <text x="1083" y="190" text-anchor="middle" font-size="12.5" fill="#37474f">sale entries, OTG accept / reject</text>
  <text x="1083" y="207" text-anchor="middle" font-size="12.5" fill="#37474f">Tireman records &amp; assignment</text>

  <!-- Flow: System -> Admin -->
  <line x1="919" y1="300" x2="1247" y2="300" stroke="#455a64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1083" y="324" text-anchor="middle" font-size="12.5" fill="#37474f">dashboards, inventory, low-stock alerts</text>
  <text x="1083" y="341" text-anchor="middle" font-size="12.5" fill="#37474f">OTG request queue &amp; details</text>
  <text x="1083" y="358" text-anchor="middle" font-size="12.5" fill="#37474f">sales history, reports</text>

  <!-- Flow: System -> Map -->
  <line x1="723" y1="346" x2="723" y2="470" stroke="#455a64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="705" y="400" text-anchor="end" font-size="12.5" fill="#37474f">customer +</text>
  <text x="705" y="417" text-anchor="end" font-size="12.5" fill="#37474f">shop coordinates</text>

  <!-- Flow: Map -> System -->
  <line x1="777" y1="470" x2="777" y2="346" stroke="#455a64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="795" y="400" text-anchor="start" font-size="12.5" fill="#37474f">route +</text>
  <text x="795" y="417" text-anchor="start" font-size="12.5" fill="#37474f">travel time (ETA)</text>

  <!-- Notes -->
  <text x="750" y="600" text-anchor="middle" font-size="11.5" font-style="italic" fill="#607d8b">The Tireman (the person who performs the on-the-go service) is not a system user and exchanges no data with the system: the Admin records and assigns Tiremen,</text>
  <text x="750" y="618" text-anchor="middle" font-size="11.5" font-style="italic" fill="#607d8b">and the customer contacts the assigned Tireman by phone. No live GPS tracking &#8212; location and ETA are captured once at request time and stored as a snapshot.</text>

  <!-- mini legend -->
  <rect x="55" y="572" width="168" height="58" fill="none" stroke="#b0bec5" stroke-width="1"/>
  <rect x="67" y="584" width="26" height="15" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="101" y="596" font-size="11" fill="#37474f">process</text>
  <rect x="67" y="607" width="26" height="15" fill="#eceff1" stroke="#37474f" stroke-width="1.5"/>
  <text x="101" y="619" font-size="11" fill="#37474f">external entity</text>
</svg>
