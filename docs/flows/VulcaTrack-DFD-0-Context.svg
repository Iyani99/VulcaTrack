<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1000" viewBox="0 0 1520 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33383d"/></marker></defs>
<rect width="1520" height="1000" fill="#fff"/>
<text x="760" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">VulcaTrack: Sales and Inventory with On-the-Go Services</text>
<text x="760" y="66" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6b7b">Context Diagram  (Data Flow Diagram – Level 0)</text>
<circle cx="760" cy="430" r="150" fill="#fff" stroke="#123a6b" stroke-width="2.4"/>
<text x="760" y="423" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1a1a1a">VulcaTrack</text>
<text x="760" y="447" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1a1a1a">System</text>
<circle cx="760" cy="300" r="12.5" fill="#123a6b"/>
<text x="760" y="304.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">0</text>
<rect x="70" y="355" width="210" height="150" fill="#eef0f3" stroke="#1a1a1a" stroke-width="2"/>
<text x="175.0" y="436.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Customer</text>
<rect x="1240" y="355" width="210" height="150" fill="#eef0f3" stroke="#1a1a1a" stroke-width="2"/>
<text x="1345.0" y="436.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Admin</text>
<line x1="280" y1="388" x2="607" y2="388" stroke="#33383d" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="394" y="284" width="261" height="63" fill="#fff" fill-opacity="0.92"/>
<text x="525" y="296" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Login Credentials / Registration Details</text>
<text x="525" y="310" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Profile Information</text>
<text x="525" y="325" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Vehicle Information</text>
<text x="525" y="340" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Service Request  &amp;  Location Coordinates</text>
<line x1="607" y1="474" x2="280" y2="474" stroke="#33383d" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="385" y="488" width="280" height="78" fill="#fff" fill-opacity="0.92"/>
<text x="525" y="500" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Account Confirmation</text>
<text x="525" y="514" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Saved Vehicle List</text>
<text x="525" y="529" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Request Confirmation, Frozen ETA  &amp;  Status</text>
<text x="525" y="544" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Assigned Tireman Name &amp; Contact</text>
<text x="525" y="558" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Service Request History</text>
<line x1="1240" y1="388" x2="913" y2="388" stroke="#33383d" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="849" y="270" width="312" height="92" fill="#fff" fill-opacity="0.92"/>
<text x="1005" y="282" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Login Credentials</text>
<text x="1005" y="296" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Product / Service Information</text>
<text x="1005" y="311" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Stock Updates  &amp;  Item Activation</text>
<text x="1005" y="326" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Sale Details  (items, quantities, cash tendered)</text>
<text x="1005" y="340" text-anchor="middle" font-size="11.5" fill="#1a1a1a">OTG Request Decision  &amp;  Tireman Assignment</text>
<text x="1005" y="354" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Tireman Information</text>
<line x1="913" y1="474" x2="1240" y2="474" stroke="#33383d" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="874" y="488" width="261" height="78" fill="#fff" fill-opacity="0.92"/>
<text x="1005" y="500" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Access Confirmation</text>
<text x="1005" y="514" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Inventory List  &amp;  Low-Stock Alerts</text>
<text x="1005" y="529" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Pending OTG Requests, Location &amp; Details</text>
<text x="1005" y="544" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Printable Receipt</text>
<text x="1005" y="558" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Sales Records</text>
<text x="760" y="715" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6b7b" font-style="italic">The Tireman performs the on-the-go service but is not a system user: the Admin records and assigns Tiremen, and the customer</text>
<text x="760" y="733" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6b7b" font-style="italic">contacts the assigned Tireman by phone.  No live GPS tracking — location and ETA are captured once at request time and stored</text>
<text x="760" y="751" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6b7b" font-style="italic">as a frozen snapshot.  Online / gateway payment (e.g. GCash) is out of scope.</text>
<rect x="70" y="810" width="360" height="110" fill="#fafafa" stroke="#dcdfe3"/>
<text x="86" y="836" text-anchor="start" font-size="12.5" font-weight="700" fill="#1a1a1a">Notation</text>
<circle cx="98" cy="858" r="10" fill="#fff" stroke="#123a6b" stroke-width="1.8"/>
<text x="118" y="862" text-anchor="start" font-size="11.5" font-weight="400" fill="#1a1a1a">Process</text>
<rect x="88" y="874" width="22" height="16" fill="#eef0f3" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="118" y="887" text-anchor="start" font-size="11.5" font-weight="400" fill="#1a1a1a">External Entity</text>
<path d="M300,850 h-24 v16 h24" fill="none" stroke="#123a6b" stroke-width="1.8"/>
<text x="310" y="862" text-anchor="start" font-size="11.5" font-weight="400" fill="#1a1a1a">Data Store</text>
<line x1="276" y1="882" x2="302" y2="882" stroke="#33383d" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="310" y="886" text-anchor="start" font-size="11.5" font-weight="400" fill="#1a1a1a">Data Flow</text>
</svg>
