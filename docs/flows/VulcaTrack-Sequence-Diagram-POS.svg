<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1252" viewBox="0 0 1700 1252" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<defs>
<marker id="call" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#1a1a1a"/></marker>
<marker id="ret" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#555"/></marker>
</defs>
<rect width="1700" height="1252" fill="#ffffff"/>
<text x="850" y="44" font-size="28" font-weight="700" fill="#111" text-anchor="middle"><tspan x="850" dy="0">VulcaTrack: Sales and Inventory with On-the-Go Services</tspan></text>
<text x="850" y="76" font-size="20" font-weight="400" fill="#444" text-anchor="middle"><tspan x="850" dy="0">Sequence Diagram — In-Shop POS Sale</tspan></text>
<path d="M100,198 L100,1108" fill="none" stroke="#777" stroke-width="1.6" stroke-dasharray="8 6"/>
<path d="M560,164 L560,1108" fill="none" stroke="#777" stroke-width="1.6" stroke-dasharray="8 6"/>
<path d="M990,164 L990,1108" fill="none" stroke="#777" stroke-width="1.6" stroke-dasharray="8 6"/>
<path d="M1290,164 L1290,1108" fill="none" stroke="#777" stroke-width="1.6" stroke-dasharray="8 6"/>
<path d="M1560,164 L1560,1108" fill="none" stroke="#777" stroke-width="1.6" stroke-dasharray="8 6"/>
<g stroke="#1a1a1a" stroke-width="2.4" fill="none"><circle cx="100" cy="104" r="12"/><path d="M100,116 V142 M82,126 H118 M100,142 L86,162 M100,142 L114,162"/></g>
<text x="100" y="188" font-size="22" font-weight="700" fill="#111" text-anchor="middle"><tspan x="100" dy="0">Admin</tspan></text>
<rect x="435" y="96" width="250" height="66" rx="4" fill="#f5cf4f" stroke="#9a7a10" stroke-width="2"/>
<text x="560" y="124.7" font-size="22" font-weight="700" fill="#111" text-anchor="middle"><tspan x="560" dy="0">VulcaTrack POS</tspan><tspan x="560" dy="24">(SaleService)</tspan></text>
<rect x="865" y="96" width="250" height="66" rx="4" fill="#f5cf4f" stroke="#9a7a10" stroke-width="2"/>
<text x="990" y="124.7" font-size="22" font-weight="700" fill="#111" text-anchor="middle"><tspan x="990" dy="0">Items</tspan><tspan x="990" dy="24">(items table)</tspan></text>
<rect x="1165" y="96" width="250" height="66" rx="4" fill="#f5cf4f" stroke="#9a7a10" stroke-width="2"/>
<text x="1290" y="124.7" font-size="22" font-weight="700" fill="#111" text-anchor="middle"><tspan x="1290" dy="0">Sales &amp; Line Items</tspan><tspan x="1290" dy="24">(sales, sale_items)</tspan></text>
<rect x="1435" y="96" width="250" height="66" rx="4" fill="#f5cf4f" stroke="#9a7a10" stroke-width="2"/>
<text x="1560" y="124.7" font-size="22" font-weight="700" fill="#111" text-anchor="middle"><tspan x="1560" dy="0">Transaction</tspan><tspan x="1560" dy="24">Summary</tspan></text>
<rect x="410" y="546" width="970" height="352" rx="0" fill="none" stroke="#2f5f82" stroke-width="2"/>
<rect x="553" y="214" width="14" height="732" rx="0" fill="#e9ecef" stroke="#555" stroke-width="1.4"/>
<path d="M410,546 H970 V568 L952,582 H410 z" fill="#e3eef7" stroke="#2f5f82" stroke-width="2"/>
<text x="422" y="572" font-size="19" font-weight="700" fill="#1d3f59" text-anchor="start"><tspan x="422" dy="0">atomic: one database transaction (all or nothing)</tspan></text>
<path d="M108,222 L552,222" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#call)"/>
<text x="330" y="212" font-size="22" font-weight="400" fill="#111" text-anchor="middle" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="330" dy="0">Add items / services + quantities</tspan></text>
<path d="M108,266 L552,266" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#call)"/>
<text x="330" y="256" font-size="22" font-weight="400" fill="#111" text-anchor="middle" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="330" dy="0">Optional: link a customer (else walk-in)</tspan></text>
<path d="M568,310 L982,310" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#call)"/>
<text x="775" y="300" font-size="22" font-weight="400" fill="#111" text-anchor="middle" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="775" dy="0">Read active items &amp; current prices</tspan></text>
<path d="M567,350 L620,350 L620,376 L569,376" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
<text x="632" y="363" font-size="22" font-weight="400" fill="#111" text-anchor="start" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="632" dy="0">Compute cart total</tspan></text>
<path d="M552,412 L108,412" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ret)" stroke-dasharray="9 6"/>
<text x="330" y="402" font-size="22" font-weight="400" fill="#333" text-anchor="middle" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="330" dy="0">Show total due</tspan></text>
<path d="M108,456 L552,456" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#call)"/>
<text x="330" y="446" font-size="22" font-weight="400" fill="#111" text-anchor="middle" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="330" dy="0">Enter cash tendered; Complete Sale</tspan></text>
<path d="M567,496 L620,496 L620,522 L569,522" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
<text x="632" y="509" font-size="22" font-weight="400" fill="#111" text-anchor="start" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="632" dy="0">Cash ≥ total? Change is shown, not stored</tspan></text>
<path d="M568,620 L982,620" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#call)"/>
<text x="775" y="610" font-size="22" font-weight="400" fill="#111" text-anchor="middle" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="775" dy="0">Lock item rows; re-read prices &amp; stock</tspan></text>
<path d="M567,660 L620,660 L620,686 L569,686" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
<text x="632" y="673" font-size="22" font-weight="400" fill="#111" text-anchor="start" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="632" dy="0">Check stock and expected total (refuse if changed)</tspan></text>
<path d="M568,722 L1282,722" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#call)"/>
<text x="925" y="712" font-size="22" font-weight="400" fill="#111" text-anchor="middle" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="925" dy="0">Insert sale (date, admin, customer or NULL, total)</tspan></text>
<path d="M568,766 L1282,766" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#call)"/>
<text x="925" y="756" font-size="22" font-weight="400" fill="#111" text-anchor="middle" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="925" dy="0">Insert line items (frozen unit price, subtotal)</tspan></text>
<path d="M568,810 L982,810" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#call)"/>
<text x="775" y="800" font-size="22" font-weight="400" fill="#111" text-anchor="middle" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="775" dy="0">Deduct stock: product lines only</tspan></text>
<path d="M567,850 L620,850 L620,876 L569,876" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#call)"/>
<text x="632" y="863" font-size="22" font-weight="400" fill="#111" text-anchor="start" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="632" dy="0">Commit (any failure → roll back: nothing saved)</tspan></text>
<path d="M552,942 L108,942" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ret)" stroke-dasharray="9 6"/>
<text x="330" y="932" font-size="22" font-weight="400" fill="#333" text-anchor="middle" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="330" dy="0">Sale #N recorded + cash received, change</tspan></text>
<path d="M108,986 L1552,986" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#call)"/>
<text x="830" y="976" font-size="22" font-weight="400" fill="#111" text-anchor="middle" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="830" dy="0">Open Transaction Summary</tspan></text>
<path d="M1552,1030 L1298,1030" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#call)"/>
<text x="1425" y="1020" font-size="22" font-weight="400" fill="#111" text-anchor="middle" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="1425" dy="0">Read sale &amp; frozen lines</tspan></text>
<path d="M1552,1074 L108,1074" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ret)" stroke-dasharray="9 6"/>
<text x="830" y="1064" font-size="22" font-weight="400" fill="#333" text-anchor="middle" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="830" dy="0">Display / print Transaction Summary</tspan></text>
<rect x="30" y="1128" width="1640" height="96.1" rx="0" fill="#fff8d6" stroke="#a08a2a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="48" y="1154" font-size="19" font-weight="400" fill="#3d3510" text-anchor="start"><tspan x="48" dy="0">Walk-in sale: sales.customer_id is NULL. Unit prices come from the database and are frozen on the sale lines.</tspan><tspan x="48" dy="24.7">Product lines reduce items.stock_quantity; service lines do not. Cash tendered and change are checked and shown, not stored.</tspan><tspan x="48" dy="24.7">The Transaction Summary is for transaction reference only — not an official BIR invoice. (Rescue-linked sales use the same POS.)</tspan></text>
</svg>
